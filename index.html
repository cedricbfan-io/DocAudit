<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>DocAudit — opening the demo</title>
<style>
:root{--blue:#0249E1;--sky:#80B0EC;--ink:#111;--lime:#DAFB71;--red:#EE3D5A}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--blue);padding:24px 16px;
 font:16px/1.5 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
.card{background:#fff;border-radius:28px;width:100%;max-width:440px;padding:14px;box-shadow:0 30px 60px rgba(0,20,80,.35)}
.band{border-radius:18px;padding:18px;color:#fff;background:
 radial-gradient(circle at 15% 130%,var(--red) 0 24%,transparent 25%),
 radial-gradient(circle at 85% -40%,var(--lime) 0 30%,transparent 31%),linear-gradient(135deg,#0a3fc0,var(--blue))}
.band small{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.band h1{margin:6px 0 0;font-size:26px}
.cut{position:relative;height:26px;margin:6px -14px;overflow:hidden}
.cut:after{content:"";position:absolute;left:26px;right:26px;top:12px;border-top:2px dotted var(--sky)}
.cut i{position:absolute;top:0;width:26px;height:26px;border-radius:50%;background:var(--blue)}
.cut i:first-child{left:-13px}.cut i:last-child{right:-13px}
.body{padding:4px 12px 12px}
p{margin:8px 0}
.muted{color:#5b6170;font-size:14px}
.btn{display:block;text-align:center;margin-top:14px;border-radius:999px;padding:13px;font-weight:700;
 background:var(--lime);color:var(--ink);text-decoration:none}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--blue);margin-right:8px;animation:p 1s infinite alternate}
@keyframes p{to{opacity:.25}}
.err{background:#fff0f3;border-left:3px solid var(--red);border-radius:8px;padding:8px 10px;font-size:14px}
</style></head><body>
<main class="card">
  <div class="band"><small>DocAudit · demo</small><h1>Explainable receipt check</h1></div>
  <div class="cut"><i></i><i></i></div>
  <div class="body">
    <p id="msg"><span class="dot"></span>Opening the demo… <span class="muted">正在打开演示…</span></p>
    <p id="detail" class="muted">The demo runs on a team member's computer; this page always forwards you to its current address.</p>
    <a id="go" class="btn" hidden>Open DocAudit</a>
    <noscript><p class="err">This page needs JavaScript to find the current address of the demo.</p></noscript>
  </div>
</main>
<script>
// The demo's address changes whenever its tunnel restarts. url.json (next to
// this page) is rewritten by the computer that hosts the demo. We only
// forward to an address that answers its own health check.
const REPO = "cedricbfan-io/DocAudit", BRANCH = "gh-pages";
const SOURCES = [
  () => fetch("url.json?t=" + Date.now(), {cache: "no-store"}).then(r => r.json()),
  // GitHub Pages can serve an old copy for a few minutes; the API does not
  () => fetch(`https://api.github.com/repos/${REPO}/contents/url.json?ref=${BRANCH}&t=${Date.now()}`,
              {headers: {Accept: "application/vnd.github.raw"}, cache: "no-store"}).then(r => r.json()),
];
const ok = u => typeof u === "string" && /^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(u);
async function alive(u) {
  const c = new AbortController(); const t = setTimeout(() => c.abort(), 12000);
  try { const r = await fetch(u + "/healthz", {signal: c.signal, cache: "no-store"});
        return (await r.json()).ok === true; }
  catch (e) { return false; } finally { clearTimeout(t); }
}
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
(async () => {
  let last = null, when = "";
  for (let round = 0; round < 8; round++) {
    for (const src of SOURCES) {
      let j; try { j = await src(); } catch (e) { continue; }
      if (!j || !ok(j.url)) { when = (j && j.updated) || when; continue; }
      last = j.url; when = j.updated || when;
      if (await alive(j.url)) { location.replace(j.url + "/" + location.search + location.hash); return; }
    }
    $("detail").textContent = "Still looking for the demo… (try " + (round + 2) + " of 8)";
    await sleep(5000);
  }
  $("msg").className = "err";
  $("msg").textContent = "The demo is not reachable right now — its computer may be off or reconnecting. Please try again in a few minutes. 演示暂时无法访问，请稍后再试。";
  $("detail").textContent = when ? "Last update from the demo computer: " + when : "";
  if (last) { $("go").hidden = false; $("go").href = last + "/"; $("go").textContent = "Try the last known address anyway"; }
})();
</script>
</body></html>
